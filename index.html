<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>💖 测测！你正缘的星座 + MBTI</title>
<style>
:root {
  --primary-gradient: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
  --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #f3e8ff 100%);
  --card-bg: rgba(255, 255, 255, 0.95);
  --text-main: #2b2d42;
  --text-sub: #8d99ae;
  --accent-bg: #fff5f7;
  --border-color: #ffccd5;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg-gradient);
  color: var(--text-main);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 16px;
}

.container {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  border-radius: 24px;
  box-shadow: 0 20px 40px rgba(255, 77, 109, 0.15);
  width: 100%;
  max-width: 500px;
  padding: 28px;
  border: 1px solid rgba(255, 255, 255, 0.8);
}

h1 {
  font-size: 24px;
  background: var(--primary-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
  text-align: center;
  font-weight: 900;
  letter-spacing: 0.5px;
}

p.subtitle {
  font-size: 13.5px;
  color: var(--text-sub);
  margin-bottom: 24px;
  text-align: center;
  font-weight: 500;
}

.form-group {
  margin-bottom: 22px;
  text-align: left;
}

label.question-title {
  display: block;
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 10px;
  color: var(--text-main);
  line-height: 1.4;
}

select {
  width: 100%;
  padding: 14px;
  border: 1.5px solid var(--border-color);
  border-radius: 12px;
  background-color: var(--accent-bg);
  font-size: 14.5px;
  color: var(--text-main);
  outline: none;
  font-weight: 600;
}

.radio-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.radio-label {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background-color: var(--accent-bg);
  border: 1.5px solid var(--border-color);
  border-radius: 12px;
  cursor: pointer;
  font-size: 14px;
  color: #4a4e69;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  line-height: 1.4;
  font-weight: 500;
}

.radio-label:hover {
  background-color: #ffe3e8;
  border-color: #ff758f;
}

.radio-label input {
  accent-color: #ff4d6d;
  transform: scale(1.2);
}

button.submit-btn {
  width: 100%;
  padding: 16px;
  background: var(--primary-gradient);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
  box-shadow: 0 6px 20px rgba(255, 77, 109, 0.35);
  transition: transform 0.2s, opacity 0.2s;
  letter-spacing: 1px;
}

button.submit-btn:active {
  transform: scale(0.98);
}

#result {
  margin-top: 28px;
  display: none;
}

.share-card {
  background: #ffffff;
  border-radius: 20px;
  padding: 26px 22px;
  box-shadow: 0 15px 35px rgba(255, 77, 109, 0.18);
  border: 2px solid #ffe5e9;
  position: relative;
  overflow: hidden;
}

.share-card::before {
  content: "";
  position: absolute;
  top: -50px;
  right: -50px;
  width: 140px;
  height: 140px;
  background: rgba(255, 77, 109, 0.06);
  border-radius: 50%;
}

.poster-header {
  text-align: center;
  margin-bottom: 20px;
  padding-bottom: 18px;
  border-bottom: 1.5px dashed var(--border-color);
}

.poster-tag {
  display: inline-block;
  background: var(--primary-gradient);
  color: #fff;
  padding: 5px 16px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
  box-shadow: 0 3px 10px rgba(255, 77, 109, 0.3);
}

.user-badge {
  font-size: 13.5px;
  color: var(--text-sub);
  margin-bottom: 8px;
  font-weight: 500;
}

.user-badge span {
  color: #ff4d6d;
  font-weight: bold;
}

.match-target {
  font-size: 21px;
  color: var(--text-main);
  font-weight: 900;
  line-height: 1.35;
}

.match-target-highlight {
  color: #ff4d6d;
  font-size: 23px;
  display: block;
  margin-top: 6px;
}

.score-badge {
  background: var(--accent-bg);
  border: 1.5px solid #ffccd5;
  border-radius: 14px;
  padding: 12px;
  text-align: center;
  margin-bottom: 20px;
}

.score-num {
  font-size: 26px;
  font-weight: 900;
  color: #ff4d6d;
}

.score-sub {
  font-size: 12.5px;
  color: var(--text-sub);
  font-weight: 600;
  margin-top: 2px;
}

.analysis-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.analysis-item {
  background: #fff8f9;
  border-left: 3.5px solid #ff4d6d;
  border-radius: 0 12px 12px 0;
  padding: 14px;
}

.item-title {
  font-size: 14px;
  font-weight: 800;
  color: #ff4d6d;
  margin-bottom: 5px;
}

.item-desc {
  font-size: 13px;
  line-height: 1.6;
  color: #4a4e69;
  font-weight: 500;
}

.poster-footer {
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1.5px solid #f0f0f5;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-brand .brand-name {
  font-size: 12.5px;
  font-weight: bold;
  color: var(--text-main);
}

.footer-brand .brand-sub {
  font-size: 10.5px;
  color: #aaa;
}

.screenshot-tip {
  background: #2b2d42;
  color: #fff;
  font-size: 11.5px;
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="container" id="mainContainer">
  <h1>💖 测测！你正缘的星座 + MBTI</h1>
  <p class="subtitle">✨ 命中注定的灵魂伴侣 · 精准匹配你的理想恋人</p>

  <div class="form-group">
    <label class="question-title">你的初始 MBTI 类型：</label>
    <select id="mbti">
      <option value="INTJ">INTJ 建筑师</option>
      <option value="INTP">INTP 逻辑学家</option>
      <option value="ENTJ">ENTJ 指挥官</option>
      <option value="ENTP">ENTP 辩论家</option>
      <option value="INFJ">INFJ 提倡者</option>
      <option value="INFP">INFP 调停者</option>
      <option value="ENFJ">ENFJ 主人公</option>
      <option value="ENFP">ENFP 竞选者</option>
      <option value="ISTJ">ISTJ 物流师</option>
      <option value="ISFJ">ISFJ 守卫者</option>
      <option value="ESTJ">ESTJ 总经理</option>
      <option value="ESFJ">ESFJ 执政官</option>
      <option value="ISTP">ISTP 鉴赏家</option>
      <option value="ISFP">ISFP 探险家</option>
      <option value="ESTP" selected>ESTP 企业家</option>
      <option value="ESFP">ESFP 表演者</option>
    </select>
  </div>

  <div class="form-group">
    <label class="question-title">你的太阳星座：</label>
    <select id="zodiac">
      <option value="白羊座" selected>白羊座 (03.21 - 04.19)</option>
      <option value="金牛座">金牛座 (04.20 - 05.20)</option>
      <option value="双子座">双子座 (05.21 - 06.21)</option>
      <option value="巨蟹座">巨蟹座 (06.22 - 07.22)</option>
      <option value="狮子座">狮子座 (07.23 - 08.22)</option>
      <option value="处女座">处女座 (08.23 - 09.22)</option>
      <option value="天秤座">天秤座 (09.23 - 10.23)</option>
      <option value="天蝎座">天蝎座 (10.24 - 11.22)</option>
      <option value="射手座">射手座 (11.23 - 12.21)</option>
      <option value="摩羯座">摩羯座 (12.22 - 01.19)</option>
      <option value="水瓶座">水瓶座 (01.20 - 02.18)</option>
      <option value="双鱼座">双鱼座 (02.19 - 03.20)</option>
    </select>
  </div>

  <hr style="border: 0; border-top: 1.5px dashed var(--border-color); margin: 20px 0;">

  <!-- 15 道题目 -->
  <div class="form-group">
    <label class="question-title">1. 周末约会时，你更倾向于哪种行程安排？</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q1" value="A" checked> 提前做足攻略，时间与路线安排得井井有条</label>
      <label class="radio-label"><input type="radio" name="q1" value="B"> 确定一个目的地，到了之后随性走走逛逛</label>
      <label class="radio-label"><input type="radio" name="q1" value="C"> 无所谓行程，只要能和对方粘在一起就好</label>
      <label class="radio-label"><input type="radio" name="q1" value="D"> 各自在家看看书/玩游戏，晚一点再聚餐</label>
    </div>
  </div>

  <div class="form-group">
    <label class="question-title">2. 当你工作或学习遇到不顺心向对方倾诉时，你最希望：</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q2" value="A" checked> 坚定地站在我这边，帮我吐槽排解情绪</label>
      <label class="radio-label"><input type="radio" name="q2" value="B"> 冷静帮我分析原因，并给出具体的解决方案</label>
      <label class="radio-label"><input type="radio" name="q2" value="C"> 带我去吃好吃的或散心，用行动转移注意力</label>
      <label class="radio-label"><input type="radio" name="q2" value="D"> 静静倾听并拥抱我，给我充分的温柔共鸣</label>
    </div>
  </div>

  <div class="form-group">
    <label class="question-title">3. 两个人产生分歧或小争执时，你通常会：</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q3" value="A" checked> 希望当场直截了当说清楚，不把情绪留到明天</label>
      <label class="radio-label"><input type="radio" name="q3" value="B"> 先各自冷静一会儿，找时间列出事实理性讨论</label>
      <label class="radio-label"><input type="radio" name="q3" value="C"> 顺应对方的态度，主动给个软话避免冲突</label>
      <label class="radio-label"><input type="radio" name="q3" value="D"> 戴上耳机做自己的事，等双方都恢复理智再聊</label>
    </div>
  </div>

  <div class="form-group">
    <label class="question-title">4. 约会去网红餐厅排队需要等很长时间，你会：</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q4" value="A" checked> 边排队边愉快聊天，把等待当成甜蜜的相处</label>
      <label class="radio-label"><input type="radio" name="q4" value="B"> 果断换一家不需要等位的高品质餐厅，不浪费时间</label>
      <label class="radio-label"><input type="radio" name="q4" value="C"> 取号后去附近买杯奶茶或逛街，时间到了再回来</label>
      <label class="radio-label"><input type="radio" name="q4" value="D"> 听从对方的决定，对方想等就等、想换就换</label>
    </div>
  </div>

  <div class="form-group">
    <label class="question-title">5. 在日常陪伴中，你更看重哪种相处状态？</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q5" value="A" checked> 两个人共享喜好，有聊不完的共同话题和理想</label>
      <label class="radio-label"><input type="radio" name="q5" value="B"> 即使各自做不同的事情，呆在同个空间也感到舒服</label>
      <label class="radio-label"><input type="radio" name="q5" value="C"> 定期有浪漫的仪式感和惊喜，保持感情热情</label>
      <label class="radio-label"><input type="radio" name="q5" value="D"> 能互相帮助、在事业或生活上成为强有力的后盾</label>
    </div>
  </div>

  <div class="form-group">
    <label class="question-title">6. 对于恋爱中的“报备”与社交边界，你觉得：</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q6" value="A" checked> 主动告知行程是给彼此安全感的基本方式</label>
      <label class="radio-label"><input type="radio" name="q6" value="B"> 保持信任即可，不需要事无巨细地汇报个人空间</label>
      <label class="radio-label"><input type="radio" name="q6" value="C"> 只要不和异性有过于亲密的单独互动，其他都自由</label>
      <label class="radio-label"><input type="radio" name="q6" value="D"> 最好共享彼此的日程卡，这样方便安排重合的空闲时间</label>
    </div>
  </div>

  <div class="form-group">
    <label class="question-title">7. 挑选送给对方的生日礼物时，你更倾向于：</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q7" value="A" checked> 实用性强、对方日常生活正需要的硬核物品</label>
      <label class="radio-label"><input type="radio" name="q7" value="B"> 充满心意、有独特纪念意义或手工制作的礼物</label>
      <label class="radio-label"><input type="radio" name="q7" value="C"> 带对方去体验一次高端SPA或旅行等浪漫记忆</label>
      <label class="radio-label"><input type="radio" name="q7" value="D"> 直接询问对方想要什么，精准清空对方的购物车</label>
    </div>
  </div>

  <div class="form-group">
    <label class="question-title">8. 如果原定的出行计划因为天气或突发状况取消，你的反应是：</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q8" value="A" checked> 快速调整，迅速找寻室内或备选的替代方案</label>
      <label class="radio-label"><input type="radio" name="q8" value="B"> 顺其自然，干脆改在家里休息、看电影点外卖</label>
      <label class="radio-label"><input type="radio" name="q8" value="C"> 会感到些许沮丧，需要对方及时安抚情绪</label>
      <label class="radio-label"><input type="radio" name="q8" value="D"> 觉得没关系，正好利用空出来的这段时间处理个人琐事</label>
    </div>
  </div>

  <div class="form-group">
    <label class="question-title">9. 哪种类型的性格特征最容易吸引你？</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q9" value="A" checked> 沉稳靠谱、做事有条理、有担当的类型</label>
      <label class="radio-label"><input type="radio" name="q9" value="B"> 幽默风趣、富有创造力、脑洞大开的类型</label>
      <label class="radio-label"><input type="radio" name="q9" value="C"> 温柔细腻、懂得倾听、情绪价值拉满的体贴类型</label>
      <label class="radio-label"><input type="radio" name="q9" value="D"> 清冷独立、智商超高、理性深沉的学霸类型</label>
    </div>
  </div>

  <div class="form-group">
    <label class="question-title">10. 当你处于情绪低谷期不想说话时，希望对方：</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q10" value="A" checked> 默默陪在旁边，不用说太多，给足安全感</label>
      <label class="radio-label"><input type="radio" name="q10" value="B"> 给我独立的个人空间，等我想说的时候再开口</label>
      <label class="radio-label"><input type="radio" name="q10" value="C"> 耐心引导我表达出来，帮我排解心中的不快</label>
      <label class="radio-label"><input type="radio" name="q10" value="D"> 用逻辑帮我厘清问题根源，一步步拆解烦恼</label>
    </div>
  </div>

  <div class="form-group">
    <label class="question-title">11. 你如何看待在朋友圈或社交平台公开恋情？</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q11" value="A" checked> 这是对感情负责的态度，应该大方分享给亲友</label>
      <label class="radio-label"><input type="radio" name="q11" value="B"> 个人生活没必要向外界展示，低调幸福就好</label>
      <label class="radio-label"><input type="radio" name="q11" value="C"> 顺其自然，有合适契机或纪念日就发，不强求</label>
      <label class="radio-label"><input type="radio" name="q11" value="D"> 仅设置好友可见或只发背景图，留一点私密感</label>
    </div>
  </div>

  <div class="form-group">
    <label class="question-title">12. 忙碌状态下对方未能及时回复微信，你的想法是：</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q12" value="A" checked> 理解对方在忙，自己也专注做手头的事</label>
      <label class="radio-label"><input type="radio" name="q12" value="B"> 会有些许焦虑，但等对方空闲后说明原因即可</label>
      <label class="radio-label"><input type="radio" name="q12" value="C"> 习惯对方提前交代一声，避免不必要的猜测与担心</label>
      <label class="radio-label"><input type="radio" name="q12" value="D"> 完全不care，反正大家都是成熟的成年人了</label>
    </div>
  </div>

  <div class="form-group">
    <label class="question-title">13. 你认为一段长久健康的恋爱关系，核心在于：</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q13" value="A" checked> 相互理解与包容，能够彼此陪伴成长</label>
      <label class="radio-label"><input type="radio" name="q13" value="B"> 相同的价值观与生活步调</label>
      <label class="radio-label"><input type="radio" name="q13" value="C"> 保持各自的独立性，同时又紧密依恋</label>
      <label class="radio-label"><input type="radio" name="q13" value="D"> 彼此高度信任，坦诚相对不隐瞒</label>
    </div>
  </div>

  <div class="form-group">
    <label class="question-title">14. 对于日常生活中的消费与财务规划，你倾向于：</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q14" value="A" checked> 互相大方付出，不计较小钱，重大支出共同商议</label>
      <label class="radio-label"><input type="radio" name="q14" value="B"> 保持清晰的账目或AA制，避免经济上的牵扯</label>
      <label class="radio-label"><input type="radio" name="q14" value="C"> 建立共同基金，为未来的生活与旅行做计划</label>
      <label class="radio-label"><input type="radio" name="q14" value="D"> 谁赚钱多谁多承担一点，随性自然</label>
    </div>
  </div>

  <div class="form-group">
    <label class="question-title">15. 你心目中理想的“灵魂伴侣”最突出的品质是：</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="q15" value="A" checked> 能看穿你的坚强，懂你所有的欲言又止</label>
      <label class="radio-label"><input type="radio" name="q15" value="B"> 能陪你体验生活中的酸甜苦辣，脚踏实地</label>
      <label class="radio-label"><input type="radio" name="q15" value="C"> 在思想和价值观上能与你产生深刻的碰撞与共鸣</label>
      <label class="radio-label"><input type="radio" name="q15" value="D"> 有独立的精神世界，能带你看到更大更棒的世界</label>
    </div>
  </div>

  <button class="submit-btn" onclick="calculateMatch()">生成命定正缘分享海报 📑</button>

  <div id="result">
    <div class="share-card">
      <div class="poster-header">
        <span class="poster-tag">🔮 星座与MBTI · 双重恋爱基因测算</span>
        <div class="user-badge">测算性格诊断：<span id="userAttr">ESTP × 白羊座</span></div>
        <div class="match-target">
          你的命中注定正缘

      </div>

      <div class="score-badge">
        <div class="score-num" id="scoreNum">98.6%</div>
        <div class="score-sub">💞 灵魂契合指数 · 命中注定的双向奔赴</div>
      </div>

      <div class="analysis-list">
        <div class="analysis-item">
          <div class="item-title">✨ 深度正缘画像</div>

        <div class="analysis-item">
          <div class="item-title">👩‍❤️‍👨 灵魂默契度</div>

          <div class="brand-sub">找到属于你的灵魂共鸣点</div>

</div>

<script>
// 1. 页面加载时自动核销与清空网址
window.addEventListener('DOMContentLoaded', () => {
  // 清空网址栏多余参数
  if (window.location.search) {
    window.history.replaceState({}, document.title, window.location.pathname);
  }

  // 检查本地是否已经完成过测试（核销锁定）
  const hasCompleted = localStorage.getItem('crush_test_completed');
  if (hasCompleted === 'true') {
    document.getElementById('mainContainer').innerHTML = `
      <div style="text-align: center; padding: 40px 10px;">
        <h2 style="color: #ff4d6d; margin-bottom: 15px; font-size: 22px;">⚠️ 该测试链接已使用</h2>
        <p style="color: #666; font-size: 14px; line-height: 1.6;">每个链接仅限使用一次，您已完成过该测试或该名额已被核销。</p>
      </div>
    `;
  }
});

// 正缘对应表
const targetMap = {
  'INTJ': { type: 'ENFP 竞选者', zodiac: '双子座', trait: '活泼灵动、能带给你无限新鲜感' },
  'INTP': { type: 'ENTJ 指挥官', zodiac: '狮子座', trait: '气场强大、执行力强且能带你实现抱负' },
  'ENTJ': { type: 'INTP 逻辑学家', zodiac: '水瓶座', trait: '智商极高、理性深沉且能充当智囊' },
  'ENTP': { type: 'INFJ 提倡者', zodiac: '天蝎座', trait: '深沉细腻、能看穿你内心柔软的一面' },
  'INFJ': { type: 'ENTP 辩论家', zodiac: '射手座', trait: '思维敏捷、幽默风趣并能带你打破常规' },
  'INFP': { type: 'ENFJ 主人公', zodiac: '天秤座', trait: '温暖体贴、充满正能量且极具情绪价值' },
  'ENFJ': { type: 'INFP 调停者', zodiac: '巨蟹座', trait: '温柔细腻、富有诗意且能倾听你的心声' },
  'ENFP': { type: 'INTJ 建筑师', zodiac: '摩羯座', trait: '沉稳靠谱、深谋远虑且能给你定心丸' },
  'ISTJ': { type: 'ESFP 表演者', zodiac: '双子座', trait: '热情开朗、极具生活情趣且能带你打破呆板' },
  'ISFJ': { type: 'ESTP 企业家', zodiac: '白羊座', trait: '敢作敢当、行动力拉满且能带你体验新鲜世界' },
  'ESTJ': { type: 'ISFP 探险家', zodiac: '金牛座', trait: '随和温润、懂得享受生活美学与平淡温暖' },
  'ESFJ': { type: 'ISTP 鉴赏家', zodiac: '处女座', trait: '冷静低调、动手能力强且善于暗中照顾人' },
  'ISTP': { type: 'ESFJ 执政官', zodiac: '巨蟹座', trait: '细心体贴、善于照顾人并能妥善处理生活琐碎' },
  'ISFP': { type: 'ESTJ 总经理', zodiac: '天蝎座', trait: '原则性强、讲究秩序且能为你撑起一片天' },
  'ESTP': { type: 'ISFJ 守卫者', zodiac: '双鱼座', trait: '温柔包容、极具耐心且能成为你最坚实的后盾' },
  'ESFP': { type: 'ISTJ 物流师', zodiac: '摩羯座', trait: '严谨务实、一丝不苟且能帮你整理混乱的生活' }
};

// 权重计算表格：每道题每个选项对 E, N, T, J 的得分贡献
const weights = {
  q1: { A: [0, 0, 1, 3], B: [1, 2, 0, -2], C: [2, 0, -2, -1], D: [-3, 1, 1, 0] },
  q2: { A: [1, -1, -3, 0], B: [0, 1, 3, 2], C: [2, 0, 0, -1], D: [-2, 2, -3, -1] },
  q3: { A: [2, -1, 2, 2], B: [-2, 1, 3, 1], C: [0, -1, -3, -2], D: [-3, 0, 1, 0] },
  q4: { A: [2, 1, -2, -1], B: [1, -1, 3, 2], C: [0, 2, 0, -1], D: [-2, -2, -2, -3] },
  q5: { A: [1, 3, -1, 0], B: [-2, -1, 1, 1], C: [2, 2, -2, -1], D: [0, -2, 3, 3] },
  q6: { A: [1, -2, 0, 3], B: [-2, 2, 1, -3], C: [0, 1, 0, -1], D: [2, 0, 2, 3] },
  q7: { A: [0, -3, 3, 2], B: [-1, 3, -3, 0], C: [3, 2, -1, -2], D: [1, -1, 2, 1] },
  q8: { A: [2, -1, 2, 2], B: [-3, 0, -2, -3], C: [1, 2, -3, -1], D: [-2, 1, 2, 1] },
  q9: { A: [1, -2, 3, 3], B: [3, 3, -1, -2], C: [-1, 0, -3, -1], D: [-3, 2, 3, 1] },
  q10: { A: [-1, -2, -2, 0], B: [-3, 1, 1, -2], C: [2, 2, -3, 1], D: [0, 0, 3, 2] },
  q11: { A: [3, -1, 0, 2], B: [-3, 0, 2, -1], C: [0, 1, -1, -2], D: [-2, 2, 0, 1] },
  q12: { A: [-1, 0, 3, 0], B: [1, 2, -3, -2], C: [2, -2, 0, 3], D: [-3, 1, 2, -3] },
  q13: { A: [0, 1, -2, 0], B: [-1, -2, 2, 3], C: [-2, 3, 1, -2], D: [2, -1, 1, 2] },
  q14: { A: [2, 1, -2, -1], B: [-2, -2, 3, 3], C: [0, 2, 1, 2], D: [1, -1, -1, -3] },
  q15: { A: [-2, 3, -3, -1], B: [0, -3, 2, 2], C: [1, 3, 2, 0], D: [2, 2, 0, -2] }
};

function calculateMatch() {
  const zodiac = document.getElementById('zodiac').value;

  let scoreE = 0, scoreN = 0, scoreT = 0, scoreJ = 0;
  let hashVal = 0; 

  for (let i = 1; i <= 15; i++) {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    const val = selected ? selected.value : 'A';
    
    const w = weights[`q${i}`][val];
    scoreE += w[0];
    scoreN += w[1];
    scoreT += w[2];
    scoreJ += w[3];

    const valCode = val.charCodeAt(0);
    hashVal += valCode * (i * 3);
  }

  const derivedE = scoreE >= 0 ? 'E' : 'I';
  const derivedN = scoreN >= 0 ? 'N' : 'S';
  const derivedT = scoreT >= 0 ? 'T' : 'F';
  const derivedJ = scoreJ >= 0 ? 'J' : 'P';

  const userRealMBTI = `${derivedE}${derivedN}${derivedT}${derivedJ}`;
  const matchResult = targetMap[userRealMBTI];
  const scoreNum = (88.5 + (hashVal % 113) / 10).toFixed(1);

  document.getElementById('userAttr').innerText = `${userRealMBTI} × ${zodiac}`;
  document.getElementById('targetType').innerText = `${matchResult.type} × ${matchResult.zodiac}`;
  document.getElementById('scoreNum').innerText = `${scoreNum}%`;

  const descItems = document.querySelectorAll('.item-desc');
  if (descItems.length >= 4) {
    descItems[0].innerText = `✨ 你的本命人格是【${userRealMBTI}】~ 最适合你的正缘对象，往往自带【${matchResult.trait}】的特质！在他面前你可以放心地展现真实自我。`;
    descItems[1].innerText = `💘 你们的磁场非常契合！你在恋爱中非常看重${derivedT === 'T' ? '高效有力的行动力与偏爱' : '满格的情绪价值和温柔共鸣'}。在【${matchResult.zodiac}】的体贴关怀下，能给你带来极高的安全感。`;
    descItems[2].innerText = `⚠️ 避坑小提醒：因为你骨子里带点【${derivedJ === 'J' ? '规划控/细节怪' : '随性派/自由灵魂'}】，上头时容易小纠结。偶尔放平心态、把主动权交给对方，会有意想不到的惊喜体验哦~`;
    descItems[3].innerText = `💡 互动升温秘诀：多与对方分享那些有趣有意义的日常片段！充分发挥你 ${derivedE === 'E' ? '热情开朗的优势' : '细腻周到的小心思'}，能让感情迅速升温！`;
  }

  // 点击生成结果的一瞬间，写入本地缓存（正式完成核销锁定）
  localStorage.setItem('crush_test_completed', 'true');

  const resultDiv = document.getElementById('result');
  resultDiv.style.display = 'block';
  resultDiv.scrollIntoView({ behavior: 'smooth' });
}
</script>
