<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>测测！你正缘的星座 + MBTI</title>
<!-- 引入 Supabase 客户端 SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --primary-color: #ff4d6d;
  --primary-hover: #ff758f;
  --bg-color: #fff0f3;
  --card-bg: #ffffff;
  --text-main: #2b2d42;
  --text-sub: #6c757d;
  --accent-bg: #fff5f7;
  --border-color: #ffccd5;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
.container { background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 30px rgba(255, 77, 109, 0.12); width: 100%; max-width: 480px; padding: 24px; }
h1 { font-size: 22px; color: var(--primary-color); margin-bottom: 6px; text-align: center; font-weight: 800; }
p.subtitle { font-size: 13px; color: var(--text-sub); margin-bottom: 22px; text-align: center; }
.form-group { margin-bottom: 20px; text-align: left; }
label.question-title { display: block; font-size: 14.5px; font-weight: 700; margin-bottom: 10px; color: var(--text-main); line-height: 1.4; }
select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; background-color: var(--accent-bg); font-size: 14px; color: var(--text-main); outline: none; }
.radio-group { display: flex; flex-direction: column; gap: 8px; }
.radio-label { display: flex; align-items: center; gap: 10px; padding: 12px; background-color: var(--accent-bg); border: 1px solid var(--border-color); border-radius: 10px; cursor: pointer; font-size: 13.5px; color: #333; line-height: 1.4; }
.radio-label input { accent-color: var(--primary-color); }
button.submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #ff758f, #ff4d6d); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3); }
#quiz-content, #result { display: none; }
.share-card { background: #ffffff; border-radius: 20px; padding: 24px 20px; box-shadow: 0 12px 32px rgba(255, 77, 109, 0.18); border: 1.5px solid #ffe5e9; }
.poster-header { text-align: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px dashed var(--border-color); }
.poster-tag { display: inline-block; background: linear-gradient(135deg, #ff758f, #ff4d6d); color: #fff; padding: 4px 14px; border-radius: 20px; font-size: 11px; font-weight: 800; margin-bottom: 10px; }
.user-badge { font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }
.user-badge span { color: var(--primary-color); font-weight: bold; }
.match-target { font-size: 20px; color: var(--text-main); font-weight: 900; }
.match-target-highlight { color: var(--primary-color); font-size: 22px; display: block; margin-top: 4px; }
.score-badge { background: #fff0f3; border: 1px solid #ffccd5; border-radius: 12px; padding: 10px; text-align: center; margin-bottom: 18px; }
.score-num { font-size: 24px; font-weight: 900; color: var(--primary-color); }
.score-sub { font-size: 12px; color: #888; }
.analysis-list { display: flex; flex-direction: column; gap: 12px; }
.analysis-item { background: #fff8f9; border-left: 3px solid var(--primary-color); border-radius: 0 10px 10px 0; padding: 12px; }
.item-title { font-size: 13.5px; font-weight: 800; color: var(--primary-color); margin-bottom: 4px; }
.item-desc { font-size: 12.5px; line-height: 1.6; color: #444; }

/* 状态提示遮罩样式 */
#status-screen { text-align: center; padding: 40px 20px; }
#status-screen h2 { color: var(--primary-color); margin-bottom: 12px; font-size: 20px; }
#status-screen p { color: var(--text-sub); font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<div class="container">
  <h1>💖 测测！你正缘的星座 + MBTI</h1>
  <p class="subtitle">✨ 命中注定的灵魂伴侣 · 精准匹配你的理想恋人</p>

  <!-- 校验加载或错误提示屏 -->
  <div id="status-screen">
    <h2>正在验证访问权限...</h2>
    <p>请稍候，正在检查您的专属测试卡密凭证 🔓</p>
  </div>

  <!-- 答题区域（验证通过后显示） -->
  <div id="quiz-content">
    <div class="form-group">
      <label class="question-title">你的初始 MBTI 类型：</label>
      <select id="mbti">
        <option value="INTJ">INTJ 建筑师</option><option value="INTP">INTP 逻辑学家</option>
        <option value="ENTJ">ENTJ 指挥官</option><option value="ENTP">ENTP 辩论家</option>
        <option value="INFJ">INFJ 提倡者</option><option value="INFP">INFP 调停者</option>
        <option value="ENFJ">ENFJ 主人公</option><option value="ENFP">ENFP 竞选者</option>
        <option value="ISTJ">ISTJ 物流师</option><option value="ISFJ">ISFJ 守卫者</option>
        <option value="ESTJ">ESTJ 总经理</option><option value="ESFJ">ESFJ 执政官</option>
        <option value="ISTP">ISTP 鉴赏家</option><option value="ISFP">ISFP 探险家</option>
        <option value="ESTP" selected>ESTP 企业家</option><option value="ESFP">ESFP 表演者</option>
      </select>
    </div>

    <div class="form-group">
      <label class="question-title">你的太阳星座：</label>
      <select id="zodiac">
        <option value="白羊座" selected>白羊座 (03.21 - 04.19)</option><option value="金牛座">金牛座 (04.20 - 05.20)</option>
        <option value="双子座">双子座 (05.21 - 06.21)</option><option value="巨蟹座">巨蟹座 (06.22 - 07.22)</option>
        <option value="狮子座">狮子座 (07.23 - 08.22)</option><option value="处女座">处女座 (08.23 - 09.22)</option>
        <option value="天秤座">天秤座 (09.23 - 10.23)</option><option value="天蝎座">天蝎座 (10.24 - 11.22)</option>
        <option value="射手座">射手座 (11.23 - 12.21)</option><option value="摩羯座">摩羯座 (12.22 - 01.19)</option>
        <option value="水瓶座">水瓶座 (01.20 - 02.18)</option><option value="双鱼座">双鱼座 (02.19 - 03.20)</option>
      </select>
    </div>

    <hr style="border: 0; border-top: 1px dashed var(--border-color); margin: 18px 0;">

    <div class="form-group">
      <label class="question-title">1. 周末约会时，你更倾向于哪种行程安排？</label>
      <div class="radio-group">
        <label class="radio-label"><input type="radio" name="q1" value="A" checked> 提前做足攻略，时间与路线井井有条</label>
        <label class="radio-label"><input type="radio" name="q1" value="B"> 确定目的地，随性走走逛逛</label>
      </div>
    </div>

    <div class="form-group">
      <label class="question-title">2. 两个人产生分歧或小争执时，你通常会：</label>
      <div class="radio-group">
        <label class="radio-label"><input type="radio" name="q2" value="A" checked> 当场直截了当说清楚，不留过夜情绪</label>
        <label class="radio-label"><input type="radio" name="q2" value="B"> 先各自冷静，理性讨论</label>
      </div>
    </div>

    <div class="form-group">
      <label class="question-title">3. 你心目中理想的“灵魂伴侣”最突出的品质是：</label>
      <div class="radio-group">
        <label class="radio-label"><input type="radio" name="q3" value="A" checked> 能看穿你的坚强，懂你所有的欲言又止</label>
        <label class="radio-label"><input type="radio" name="q3" value="B"> 思想上能产生深刻的碰撞与共鸣</label>
      </div>
    </div>

    <button class="submit-btn" onclick="submitAndCalculate()">生成命定正缘分享海报 📑</button>
  </div>

  <!-- 结果展示区域 -->
  <div id="result">
    <div class="share-card">
      <div class="poster-header">
        <span class="poster-tag">🔮 星座与MBTI · 双重恋爱基因测算</span>
        <div class="user-badge">测算性格诊断：<span id="userAttr">ESTP × 白羊座</span></div>
        <div class="match-target">
          你的命中注定正缘
          <span class="match-target-highlight" id="targetType">ISFJ 守卫者 × 双鱼座</span>
        </div>
      </div>

      <div class="score-badge">
        <div class="score-num" id="scoreNum">98.6%</div>
        <div class="score-sub">💞 灵魂契合指数 · 命中注定的双向奔赴</div>
      </div>

      <div class="analysis-list">
        <div class="analysis-item"><div class="item-title">✨ 深度正缘画像</div><div class="item-desc" id="desc1">解析加载中...</div></div>
        <div class="analysis-item"><div class="item-title">👩‍❤️‍👨 灵魂默契度</div><div class="item-desc" id="desc2">解析加载中...</div></div>
      </div>
    </div>
  </div>
</div>

<script>
  // 已填入你的真实 Supabase 凭证
  const SUPABASE_URL = "https://hrgzmwtgpacdxifcevwy.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 获取 URL 里的 ?code=xxxx 参数
  const urlParams = new URLSearchParams(window.location.search);
  const currentCode = urlParams.get('code');

  const targetMap = {
    'INTJ': { type: 'ENFP 竞选者', zodiac: '双子座', trait: '活泼灵动、能带给你无限新鲜感' },
    'INTP': { type: 'ENTJ 指挥官', zodiac: '狮子座', trait: '气场强大、执行力强' },
    'ESTP': { type: 'ISFJ 守卫者', zodiac: '双鱼座', trait: '温柔包容、极具耐心且能成为坚实后盾' },
    'ESFP': { type: 'ISTJ 物流师', zodiac: '摩羯座', trait: '严谨务实、一丝不苟' }
  };

  // 页面加载时自动校验卡密状态
  window.addEventListener('DOMContentLoaded', async () => {
    const statusScreen = document.getElementById('status-screen');
    const quizContent = document.getElementById('quiz-content');

    if (!currentCode) {
      statusScreen.innerHTML = `<h2>⚠️ 缺少访问凭证</h2><p>请使用正确的购买链接进入本测试！</p>`;
      return;
    }

    // 去云端数据库查询卡密
    const { data, error } = await supabaseClient
      .from('codes')
      .select('*')
      .eq('code', currentCode)
      .single();

    if (error || !data) {
      statusScreen.innerHTML = `<h2>❌ 链接无效</h2><p>未找到该测试卡密，请检查您的链接是否完整。</p>`;
      return;
    }

    // 检查是否过期（48小时）
    if (data.expires_at && new Date() > new Date(data.expires_at)) {
      statusScreen.innerHTML = `<h2>⌛ 链接已过期</h2><p>该测试链接已超过 48 小时有效期，无法使用。</p>`;
      return;
    }

    // 检查是否已经使用过（used）
    if (data.status === 'used') {
      statusScreen.style.display = 'none';
      if (data.result_data) {
        // 直接展示上次的结果
        renderResult(data.result_data);
      } else {
        document.getElementById('status-screen').innerHTML = `<h2>⚠️ 已完成测试</h2><p>该链接已经使用过了。</p>`;
        document.getElementById('status-screen').style.display = 'block';
      }
      return;
    }

    // 校验通过，放行答题
    statusScreen.style.display = 'none';
    quizContent.style.display = 'block';
  });

  // 提交测试并写入云端核销
  async function submitAndCalculate() {
    const mbti = document.getElementById('mbti').value;
    const zodiac = document.getElementById('zodiac').value;
    
    const match = targetMap[mbti] || targetMap['ESTP'];
    const resultObj = {
      userAttr: `${mbti} × ${zodiac}`,
      targetType: `${match.type} × ${match.zodiac}`,
      score: "98.6%",
      desc1: `你的本命人格是【${mbti}】~ 最适合你的正缘对象，往往自带【${match.trait}】的特质！`,
      desc2: `你们的磁场非常契合！在【${match.zodiac}】的体贴关怀下，能给你带来极高的安全感。`
    };

    // 核心动作：更新云端数据库，将状态改为 'used' 并存入测算结果
    const { error } = await supabaseClient
      .from('codes')
      .update({ 
        status: 'used',
        result_data: resultObj 
      })
      .eq('code', currentCode);

    if (error) {
      alert("提交失败，请重试：" + error.message);
      return;
    }

    renderResult(resultObj);
  }

  function renderResult(res) {
    document.getElementById('status-screen').style.display = 'none';
    document.getElementById('quiz-content').style.display = 'none';
    
    document.getElementById('userAttr').innerText = res.userAttr;
    document.getElementById('targetType').innerText = res.targetType;
    document.getElementById('scoreNum').innerText = res.score;
    document.getElementById('desc1').innerText = res.desc1;
    document.getElementById('desc2').innerText = res.desc2;
    
    document.getElementById('result').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
